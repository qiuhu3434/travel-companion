<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悠行 · 出行游玩规划助手</title>
<style>
:root{
  --bg:#f0f4f8; --card:#ffffff; --primary:#0d9488; --primary-light:#ccfbf1;
  --primary-dark:#0f766e; --accent:#f59e0b; --danger:#ef4444; --danger-light:#fee2e2;
  --text:#1e293b; --text-light:#64748b; --text-muted:#94a3b8;
  --border:#e2e8f0; --sidebar:#ffffff; --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -1px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:64px 1fr;height:100vh;overflow:hidden}

/* Header */
.header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:var(--primary-dark)}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:20px}
.header-actions{display:flex;gap:12px;align-items:center}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-light)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:5px 12px;font-size:12px}

/* Sidebar */
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto}
.sidebar-title{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:8px 0 12px 8px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:4px;color:var(--text-light);font-weight:500}
.nav-item:hover{background:var(--primary-light);color:var(--primary-dark)}
.nav-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 12px rgba(13,148,136,.3)}
.nav-icon{font-size:20px;width:28px;text-align:center}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
.nav-item.active .nav-badge{background:rgba(255,255,255,.3)}

/* Main */
.main{overflow-y:auto;padding:20px}
.top-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-body{padding:16px 20px}
.section-content{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);min-height:400px}
.section-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.section-header h2{font-size:18px;display:flex;align-items:center;gap:10px}
.section-header p{color:var(--text-muted);font-size:13px;margin-top:4px}
.section-body{padding:24px}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-light);border:1px solid transparent;border-bottom:none;transition:all .2s}
.tab:hover{background:var(--primary-light)}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Cards */
.card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;transition:all .2s;background:#fff}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--primary-light)}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-weight:600;font-size:14px}
.card-meta{font-size:12px;color:var(--text-muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-teal{background:var(--primary-light);color:var(--primary-dark)}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-red{background:var(--danger-light);color:var(--danger)}

/* Weather */
.weather-box{background:linear-gradient(135deg,#0ea5e9,#0284c7);border-radius:12px;padding:20px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.weather-temp{font-size:40px;font-weight:300}
.weather-info{font-size:13px;opacity:.9}
.forecast-row{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.forecast-card{flex:0 0 90px;background:#f8fafc;border-radius:10px;padding:10px 8px;text-align:center;border:2px solid transparent;transition:.2s;cursor:pointer}
.forecast-card:hover{border-color:#0ea5e9}
.forecast-card.active{border-color:#0ea5e9;background:#e0f2fe}
.forecast-card .fc-date{font-size:11px;color:#94a3b8;margin-bottom:4px}
.forecast-card .fc-icon{font-size:28px;display:block;margin:4px 0}
.forecast-card .fc-range{font-size:12px;font-weight:700;color:#1e293b}
.forecast-card .fc-desc{font-size:10px;color:#64748b;white-space:nowrap}
.forecast-card .fc-wind{font-size:10px;color:#94a3b8}
.forecast-date-badge{display:inline-block;background:#0ea5e9;color:#fff;font-size:10px;padding:1px 5px;border-radius:6px;margin-left:4px}

/* Calendar */
.calendar{width:100%;border-collapse:collapse}
.calendar th{text-align:center;padding:10px;font-size:12px;color:var(--text-muted);font-weight:600}
.calendar td{text-align:center;padding:0;vertical-align:top}
.cal-day{width:100%;min-height:64px;border:1px solid var(--border);padding:6px 4px;cursor:pointer;transition:all .15s;font-size:13px}
.cal-day:hover{background:var(--primary-light)}
.cal-day.today{background:#e0f2fe;border-color:#0284c7}
.cal-day.selected{background:var(--primary);color:#fff}
.cal-day.other{opacity:.35}
.cal-num{font-weight:600;display:block}
.cal-yi{font-size:9px;color:var(--primary-dark);margin-top:2px;line-height:1.2}
.cal-ji{font-size:9px;color:var(--danger);margin-top:1px;line-height:1.2}
.cal-day.selected .cal-yi{color:#fff}
.cal-day.selected .cal-ji{color:#fecaca}

/* Transport grid */
.transport-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.transport-card{border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;text-align:center}
.transport-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
.transport-card.selected{background:var(--primary-light);border-color:var(--primary);border-width:2px}
.transport-icon{font-size:32px}
.transport-name{font-weight:600;margin-top:6px}
.transport-detail{font-size:11px;color:var(--text-muted);margin-top:4px}

/* Checklist */
.checklist-group{margin-bottom:24px}
.checklist-group-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--primary-light)}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .15s}
.check-item:hover{background:var(--primary-light)}
.check-box{width:20px;height:20px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.check-item.done .check-box{background:var(--primary);border-color:var(--primary)}
.check-item.done .check-box::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.check-item.done .check-label{color:var(--text-muted);text-decoration:line-through}
.check-label{font-size:13px}
.check-sub{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Budget */
.mode-toggle{display:flex;background:var(--bg);border-radius:8px;padding:4px;margin-bottom:16px}
.mode-btn{flex:1;padding:8px 12px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-light);transition:all .2s;font-family:inherit}
.mode-btn.active{background:var(--card);color:var(--primary-dark);box-shadow:var(--shadow);font-weight:600}
.budget-input-group{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.budget-input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit}
.budget-input:focus{outline:none;border-color:var(--primary)}
.plan-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.plan-card:hover{border-color:var(--primary)}
.plan-card.selected{border:2px solid var(--primary);background:var(--primary-light)}
.plan-name{font-weight:700;font-size:14px;margin-bottom:8px}
.plan-bar{display:flex;height:24px;border-radius:6px;overflow:hidden;margin:8px 0}
.plan-seg{display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:600}
.plan-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:4px}

/* Guides */
.guide-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.guide-card:hover{box-shadow:var(--shadow-md)}
.guide-source{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;display:inline-block}
.src-amap{background:#e0f2fe;color:#0369a1}
.src-ctrip{background:#fef3c7;color:#92400e}
.src-xhs{background:#fce7f3;color:#be185d}
.guide-title{font-weight:600;margin:6px 0}
.guide-summary{font-size:12px;color:var(--text-light)}
.similarity-bar{height:5px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden}
.similarity-fill{height:100%;background:linear-gradient(90deg,var(--primary),#2dd4bf);border-radius:3px;transition:width .6s}

/* 5A Scenic area guide */
.a5-province-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:8px}
.a5-province-card{border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;transition:all .15s;background:var(--card);font-size:13px}
.a5-province-card:hover,.a5-province-card.expanded{border-color:var(--primary);background:#f0f7ff}
.a5-province-name{font-weight:600;display:flex;align-items:center;justify-content:space-between}
.a5-province-body{margin-top:8px;border-top:1px solid var(--border);padding-top:4px}
.a5-city-group{margin-bottom:8px}
.a5-city-name{font-size:12px;font-weight:700;padding:2px 0;border-bottom:1px dashed var(--border);margin-bottom:4px}
.a5-area-list{display:flex;flex-direction:column;gap:3px}
.a5-area-item{border-radius:6px;padding:2px 0}
.a5-area-name{font-size:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:3px 4px;border-radius:4px;transition:background .1s}
.a5-area-name:hover{background:var(--bg)}
.a5-area-loc{font-size:10px;color:var(--text-muted)}
.a5-area-detail{padding:4px 8px 6px;font-size:11px;color:var(--text-light)}
.a5-detail-row{padding:1px 0}

.a5-result-section{margin-bottom:12px}
.a5-result-city{font-size:13px;font-weight:700;margin-bottom:4px;padding:2px 0}
.a5-result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.a5-result-card{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--card);transition:box-shadow .15s;font-size:12px}
.a5-result-card:hover{box-shadow:var(--shadow-sm)}
.a5-result-name{font-weight:600;font-size:13px;margin-bottom:2px}
.a5-result-desc{color:var(--text-light);font-size:11px;margin-bottom:4px;line-height:1.5}
.a5-result-ticket{color:var(--primary-dark);font-size:11px;font-weight:500}

/* Route timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:20px}
.timeline-dot{position:absolute;left:-24px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--primary);z-index:1}
.timeline-content{padding:12px 16px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.timeline-time{font-size:12px;color:var(--primary-dark);font-weight:600}
.timeline-place{font-weight:600;margin:2px 0}
.timeline-desc{font-size:12px;color:var(--text-light)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .2s}
.modal-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;max-width:540px;width:90%;max-height:85vh;overflow-y:auto;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-muted);line-height:1}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px}

/* Alerts */
.alert{padding:12px 16px;border-radius:8px;margin-bottom:12px;font-size:13px;display:flex;align-items:flex-start;gap:10px}
.alert-warning{background:#fef3c7;border:1px solid #fde68a;color:#92400e}
.alert-danger{background:var(--danger-light);border:1px solid #fecaca;color:var(--danger)}
.alert-success{background:#d1fae5;border:1px solid #a7f3d0;color:#065f46}
.alert-info{background:#dbeafe;border:1px solid #bfdbfe;color:#1e40af}

/* Progress */
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#2dd4bf);transition:width .5s}

/* Misc */
.empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-icon{font-size:48px;opacity:.3;margin-bottom:12px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{padding:2px 8px;border-radius:6px;font-size:11px;background:var(--bg);color:var(--text-light)}
.tag-blue{background:#e0f2fe;color:#0284c7}
.field-label{font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:600}
input,select,textarea{font-family:inherit}
.section-tabs{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:16px}
.section-tab{padding:7px 14px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text-light);transition:all .15s}
.section-tab.active{background:#fff;color:var(--primary-dark);box-shadow:var(--shadow);font-weight:600}
.day-selector{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.day-pill{padding:6px 14px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:12px;transition:all .15s}
.day-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.muted{color:var(--text-muted)}
.fw-bold{font-weight:700}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}
.flex{display:flex}.gap-8{gap:8px}.items-center{align-items:center}.justify-between{justify-content:space-between}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Smart Plan */
.rec-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.rec-tab{flex:1;text-align:center;padding:10px 0;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.rec-tab:hover{color:var(--text)}
.rec-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.rec-tab .tab-badge{font-size:10px;background:var(--bg);padding:1px 6px;border-radius:10px;margin-left:4px}
.rec-tab.active .tab-badge{background:var(--primary-light);color:var(--primary)}
.rec-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .18s}
.rec-item:hover{border-color:var(--primary-light);background:var(--bg)}
.rec-item.checked{border-color:var(--primary);background:var(--primary-light)}
.rec-item .rec-check{flex-shrink:0;width:20px;height:20px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .15s}
.rec-item.checked .rec-check{background:var(--primary);border-color:var(--primary);color:#fff}
.rec-item .rec-info{flex:1;min-width:0}
.rec-item .rec-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-item .rec-meta{font-size:11px;color:var(--text-muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.rec-item .rec-cost{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
.rec-item .rec-cost.cheap{background:#dcfce7;color:#166534}
.rec-item .rec-cost.mid{background:#fef3c7;color:#92400e}
.rec-item .rec-cost.high{background:#fce7f3;color:#9d174d}
.rec-summary{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);border-radius:10px;margin-top:16px;flex-wrap:wrap}
.rec-summary .sel-count{font-size:13px;font-weight:600}
.rec-summary .sel-tags{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.rec-summary .sel-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark)}
.day-itinerary{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
.day-itinerary-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.day-itinerary-header.rainy{background:linear-gradient(135deg,#e0f2fe,#dbeafe)}
.day-itinerary-header.sunny{background:linear-gradient(135deg,#fef3c7,#fefce8)}
.day-itinerary-header.hot{background:linear-gradient(135deg,#fee2e2,#fef2f2)}
.day-itinerary-body{padding:12px 18px}
.itinerary-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border);align-items:flex-start}
.itinerary-step:last-child{border-bottom:none}
.itinerary-time{flex-shrink:0;width:90px;font-size:12px;color:var(--primary-dark);font-weight:600;padding-top:2px}
.itinerary-label{flex-shrink:0;width:80px;font-size:12px;font-weight:600;padding-top:2px}
.itinerary-content{flex:1}
.itinerary-name{font-weight:600;font-size:13px}
.itinerary-addr{font-size:11px;color:var(--text-muted)}
.itinerary-tip{font-size:11px;color:var(--primary);margin-top:2px}
.itinerary-transit{display:flex;align-items:flex-start;gap:10px;padding:8px 0 8px 90px;margin-left:0;border-left:2px dashed var(--border)}
.itinerary-transit .transit-icon{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:14px;margin-left:-40px}
.itinerary-transit .transit-content{flex:1;background:#f8fafc;border-radius:8px;padding:8px 12px;border:1px solid var(--border)}
.itinerary-transit .transit-title{font-size:12px;font-weight:600;color:var(--primary-dark)}
.itinerary-transit .transit-detail{font-size:11px;color:var(--text-light);margin-top:2px}
.itinerary-transit .transit-summary{font-size:10px;color:var(--text-muted);margin-top:4px;padding-top:4px;border-top:1px dashed var(--border)}
.plan-controls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end;margin-bottom:16px}
.plan-source-tag{font-size:11px;padding:2px 8px;border-radius:6px;display:inline-block}
.src-live{background:#d1fae5;color:#065f46}
.src-template{background:#fef3c7;color:#92400e}
.src-fallback{background:#fee2e2;color:#991b1b}
.budget-tip{background:var(--primary-light);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px}

/* ===== 城市主题英雄区 ===== */

}

function applyCityTheme(city){
  if(!city) return '';
  const raw = city.trim();
  if(!raw) return '';

  // 辅助：去掉常见行政区划后缀，得到核心城市名
  function cleanName(name){
    return name.replace(/[省市县区旗镇乡]+$/,'').trim();
  }
  const core = cleanName(raw);

  // 1. 精确匹配
  if(cityThemes[raw]) return renderCityTheme(raw, cityThemes[raw]);
  if(cityThemes[core]) return renderCityTheme(core, cityThemes[core]);

  // 2. 子串匹配（query 至少 2 个字，避免单字误命中）
  function findSubMatch(query){
    if(!query || query.length < 2) return null;
    for(const [key,val] of Object.entries(cityThemes)){
      if(query.includes(key) || key.includes(query)) return [key,val];
    }
    return null;
  }
  let sub = findSubMatch(raw) || findSubMatch(core);
  if(sub) return renderCityTheme(sub[0], sub[1]);

  // 3. 前缀匹配：只匹配前两个字符，不再做单字包含匹配
  const short = core.substring(0,2);
  if(short.length >= 2){
    for(const [key,val] of Object.entries(cityThemes)){
      if(key.startsWith(short)) return renderCityTheme(key, val);
    }
  }

  // 未匹配到任何城市
  document.getElementById('city-hero').style.display = 'none';
  document.body.classList.remove('theme-active');
  document.body.style.setProperty('--theme-pattern','none');
  return '';
}

function renderCityTheme(matchCity, theme){
  const hero = document.getElementById('city-hero');
  hero.style.display = 'flex';
  hero.style.setProperty('--hero-gradient', theme.gradient);

  // 检查是否有专属图片
  const imgEl = document.getElementById('city-hero-img');
  if(cityImages[matchCity]){
    imgEl.src = cityImages[matchCity];
    imgEl.style.display = 'block';
    hero.classList.add('has-image');
  } else {
    imgEl.style.display = 'none';
    hero.classList.remove('has-image');
  }

  document.getElementById('hero-name').textContent = matchCity;
  document.getElementById('hero-desc').textContent = theme.desc;
  document.getElementById('hero-tags').innerHTML = theme.tags.map(t=>`<span class="city-hero-tag">${t}</span>`).join('');
  document.getElementById('hero-decor-tl').textContent = theme.decor;
  document.getElementById('hero-decor-br').textContent = theme.decor;

  // 更新 body 主题
  document.body.classList.add('theme-active');
  document.body.style.setProperty('--theme-pattern', theme.pattern || 'none');
  return matchCity;
}

/* ==================== API 调用层 ==================== */
/*
 * 原理说明：
 *   前端通过 fetch() 调用同域后端的 /api/* 接口
 *   后端再转发到高德/和风天气/微信等真实API
 *   如果后端没启动或Key未配置，自动回退到模拟数据
 *
 * 调用链路：
 *   浏览器 → localhost:3000/api/weather/now → 后端 → 和风天气API
 *   浏览器 → localhost:3000/api/amap/poi    → 后端 → 高德地图API
 *
 * 这样做的好处：
 *   1. API Key 只存在后端 .env 文件里，不暴露给前端
 *   2. 前端和后端在同一个 localhost:3000 下，没有跨域问题
 *   3. 后端没配Key时前端照样能用（模拟数据），不影响开发调试
 */

// API基础地址：同域，不需要写完整URL
// 如果后端跑在别的端口或服务器上，改成 http://localhost:3000 或你的域名
const API_BASE = '';  // 空字符串 = 同域请求，如 localhost:3000/api/...

// 数据来源标记：'live' = 真实API数据，'mock' = 模拟数据
let dataSource = { weather:'mock', poi:'mock', guides:'mock', check:'mock' };

// 通用API请求函数：失败时返回null，由调用方决定回退逻辑
async function apiFetch(path, params={}, method='GET', body=null) {
  try {
    const url = new URL(API_BASE + path, window.location.origin);
    if (method === 'GET') {
      Object.entries(params).forEach(([k,v]) => { if(v) url.searchParams.set(k, v); });
    }
    const options = { method };
    if (method === 'POST' && body) {
      options.headers = { 'Content-Type': 'application/json' };
      options.body = JSON.stringify(body);
    }
    const resp = await fetch(url, options);
    if (!resp.ok) return null;
    const json = await resp.json();
    if (json.error) { console.warn('[API]', path, json.error); return null; }
    return json;
  } catch(e) {
    console.warn('[API]', path, '请求失败，使用模拟数据:', e.message);
    return null;
  }
}

async function checkBackendStatus() {
  const result = await apiFetch('/api/health');

  if (!badge) return;
  if (result && result.status === 'ok') {
    const k = result.keys;
    const liveCount = (k.amap?1:0) + (k.qweather?1:0) + (k.wechat?1:0);
    if (liveCount > 0) {
      badge.innerHTML = '🟢 后端已连接 · ' + liveCount + '/3 个API已配置';
      badge.style.background = '#d1fae5';
      badge.style.color = '#065f46';
    } else {

      badge.style.background = '#fef3c7';
      badge.style.color = '#92400e';

  } else {
    badge.innerHTML = '🔴 后端未启动（使用模拟数据）';
    badge.style.background = '#fee2e2';
    badge.style.color = '#dc2626';
  }
}

/* ---- 天气：从后端API加载真实数据 ---- */
async function loadWeatherFromAPI(){
  if(state.date.weatherLoaded) return; // 只加载一次
  // 第一步：查城市ID（和风天气需要先获取LocationID）
  const cityResult=await apiFetch('/api/weather/city',{location:state.city});
  if(!cityResult||!cityResult.data||!cityResult.data[0]){
    console.log('[天气] 城市查询失败，使用模拟天气数据');
    return; // 保持mock数据
  }
  const locationId=cityResult.data[0].id;
  // 第二步：同时请求实时天气+预报+预警
  const [now,forecast,warning]=await Promise.all([
    apiFetch('/api/weather/now',{location:locationId}),
    apiFetch('/api/weather/forecast',{location:locationId}),
    apiFetch('/api/weather/warning',{location:locationId})
  ]);
  if(now&&now.data){
    // 用真实数据更新state
    state.date.weather={
      temp:now.data.temp,
      desc:now.data.text,
      wind:now.data.windDir+now.data.windScale+'级',
      humidity:now.data.humidity+'%',
      feelsLike:now.data.feelsLike,
      forecast: forecast&&forecast.data?forecast.data:[]
    };
    state.date.weatherLoaded=true;
    dataSource.weather='live';
    // 刷新天气卡片 + 预报行
    refreshWeatherUI();
  }
  // 如果有气象预警，在天气卡片下方显示
  if(warning&&warning.data&&warning.data.length>0){
    const detail=document.getElementById('day-detail');
    if(detail){
      let warnHtml='<div class="alert alert-danger mt-16">⚠️ 气象预警：</div>';
      warning.data.forEach(w=>{
        warnHtml+=`<div class="alert alert-danger">🔴 <strong>${w.title}</strong><br>${w.text}<br><span class="muted">${w.startTime} 至 ${w.endTime}</span></div>`;
      });
      detail.insertAdjacentHTML('afterbegin',warnHtml);
    }
  }
}

  if(t.includes('阴')) return '☁️';

  if(t.includes('风')||t.includes('沙')) return '💨';

function initCalendar(){
  const container=document.getElementById('calendar-container');
  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth();
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  let html=`<div style="text-align:center;font-weight:700;margin-bottom:12px;font-size:16px">${y}年 ${months[m]}</div>`;
  html+='<table class="calendar"><thead><tr>';
  ['日','一','二','三','四','五','六'].forEach(d=>html+=`<th>${d}</th>`);
  html+='</tr></thead><tbody><tr>';
  for(let i=0;i<firstDay;i++) html+='<td></td>';
  const today=now.getDate();
  // Deterministic pseudo-random based on day
  const pick=(arr,seed)=>arr[seed%arr.length];
  for(let d=1;d<=daysInMonth;d++){
    const dow=(firstDay+d-1)%7;
    if(dow===0&&d>1) html+='</tr><tr>';
    const isToday=d===today;
    const seed=(d*7+m*3+y)%100;
    const yi=pick(yiActions,seed); const yi2=pick(yiActions,seed+5);
    const ji=pick(jiActions,seed+2);
    html+=`<td><div class="cal-day ${isToday?'today':''}" onclick="selectDay(${d})">
      <span class="cal-num">${d}</span>
      <div class="cal-yi">宜:${yi} ${yi2}</div>
      <div class="cal-ji">忌:${ji}</div>
    </div></td>`;
  }
  html+='</tr></tbody></table>';
  container.innerHTML=html;
  selectDay(today);
}

function selectDay(d){
  document.querySelectorAll('.cal-day').forEach(el=>{
    el.classList.toggle('selected',parseInt(el.querySelector('.cal-num').textContent)===d);
  });
  state.date.selectedDay=d;
  const seed=(d*7+new Date().getMonth()*3+new Date().getFullYear())%100;
  const yi1=yiActions[seed%yiActions.length],yi2=yiActions[(seed+5)%yiActions.length],yi3=yiActions[(seed+9)%yiActions.length];
  const ji1=jiActions[(seed+2)%jiActions.length],ji2=jiActions[(seed+6)%jiActions.length];
  document.getElementById('day-detail').innerHTML=`
    <div class="alert alert-info">
      <div>

/* ---- 从高德API搜索POI ---- */
async function searchPOIFromAPI(){
  const city=document.getElementById('loc-city').value.trim()||state.city;
  const keyword=document.getElementById('loc-search').value.trim();
  if(!keyword){alert('请输入搜索关键词');return;}
  state.city=city; applyCityTheme(city);
  const resultsDiv=document.getElementById('poi-api-results');
  resultsDiv.style.display='block';
  resultsDiv.innerHTML='<div class="alert alert-info">🔍 正在从高德地图搜索「'+keyword+'」...</div>';
  // 调用后端API → 后端调用高德API
  const result=await apiFetch('/api/amap/poi',{keywords:keyword,city:city});
  if(result&&result.data&&result.data.length>0){
    dataSource.poi='live';
    resultsDiv.innerHTML=
      '<div class="alert alert-success">✅ 高德地图返回 '+result.data.length+' 条结果 <span style="font-size:11px">(实时数据)</span></div>'+
      result.data.slice(0,8).map(p=>`
        <div class="card">
          <div class="card-row">
            <div style="flex:1">
              <div class="card-title">📍 ${p.name}</div>
              <div class="card-meta">${p.address||'地址未知'} ${p.tel?' · ☎ '+p.tel:''} ${p.rating?' · ⭐'+p.rating:''}</div>
              <div class="tag-row">${(p.type||'').split(';').filter(t=>t).map(t=>'<span class="tag">'+t+'</span>').join('')}</div>
            </div>
            <div style="display:flex;gap:6px">
              <button class="btn btn-outline btn-sm" onclick="searchOnPlatform('${p.name.replace(/'/g,'')}','携程')">携程</button>
              <button class="btn btn-outline btn-sm" onclick="searchOnPlatform('${p.name.replace(/'/g,'')}','小红书')">小红书</button>
              <button class="btn btn-outline btn-sm" onclick="window.open('https://uri.amap.com/marker?position=${p.location||''}&name=${encodeURIComponent(p.name)}')">🗺️ 地图</button>
            </div>
          </div>
        </div>`).join('');
  }else{
    resultsDiv.innerHTML='<div class="alert alert-warning">⚠️ 高德API未返回数据（可能Key未配置），下方为预设示例数据。</div>';
  }
}

/* ---- 按分类从高德API加载推荐地点 ---- */
async function loadLocationsByCategory(cat){
  const city=state.city;
  const keywords=locLabels[cat];
  const types=amapTypeMap[cat]||'';
  const result=await apiFetch('/api/amap/poi',{keywords:keywords,city:city,types:types});
  if(result&&result.data&&result.data.length>0){
    dataSource.poi='live';
    return result.data.map(p=>({
      name:p.name,
      rating:p.rating?parseFloat(p.rating):4.5,
      price:p.cost||'详见平台',
      addr:(p.address||'')+' · '+city,
      tags:(p.type||'').split(';').filter(t=>t).slice(0,3)
    }));
  }
  return null; // 返回null表示API不可用，用mock数据
}

function searchOnPlatform(name,platform){

  }else if(platform==='高德'){
    url='https://www.amap.com/search?query='+encodeURIComponent(name);
    note='高德开放API可直接获取数据，此处为网页版跳转。';
  }
  openModal('🔍 '+platform+' 检索',`
    <p>正在通过 <strong>${platform}</strong> 检索「<strong>${name}</strong>」</p>
    <div class="alert alert-info mt-16">💡 ${note}</div>

function addLocation(cat,i){
  if(!state.locations[cat].includes(i)){
    state.locations[cat].push(i);

    openModal('✅ 已加入行程',`<p><strong>${p.name}</strong> 已加入行程清单。</p><p class="muted mt-8">当前已选 ${Object.values(state.locations).flat().length} 个地点。</p>`,[{label:'好的',cls:'btn-primary',fn:'closeModal()'}]);

    openModal('ℹ️ 提示',`<p>该地点已在行程清单中。</p>`,[{label:'好的',cls:'btn-primary',fn:'closeModal()'}]);

}

function initPrep(){
  if(Object.keys(state.prep).length===0){
    Object.keys(prepGroups).forEach(g=>{
      prepGroups[g].items.forEach((_,i)=>{state.prep[g+'_'+i]=false;});
    });
  }
  const container=document.getElementById('prep-groups');
  container.innerHTML=Object.entries(prepGroups).map(([k,v])=>`
    <div class="checklist-group">
      <div class="checklist-group-title">${v.icon} ${v.title}</div>
      ${v.items.map((item,i)=>`
        <div class="check-item ${state.prep[k+'_'+i]?'done':''}" onclick="togglePrep('${k}',${i})">
          <div class="check-box"></div>
          <div><div class="check-label">${item}</div></div>
        </div>`).join('')}
    </div>`).join('');
  updatePrepProgress();
}
function togglePrep(g,i){
  state.prep[g+'_'+i]=!state.prep[g+'_'+i];
  initPrep();
}
function updatePrepProgress(){
  const total=Object.keys(state.prep).length;
  const done=Object.values(state.prep).filter(v=>v).length;
  const pct=Math.round(done/total*100);
  document.getElementById('prep-progress').style.width=pct+'%';
  document.getElementById('prep-progress-text').textContent=pct+'%';
}

/* ==================== 检查与提醒 ==================== */
async function runFullCheck(){
  const issues=[];
  const done=Object.values(state.prep).filter(v=>v).length;
  const total=Object.keys(state.prep).length;
  const pct=Math.round(done/total*100);

  if(pct<100) issues.push({level:'danger',msg:`出行准备仅完成 ${pct}%，仍有 ${total-done} 项未确认，请先完善准备清单。`});
  if(!state.date.start) issues.push({level:'warning',msg:'未设置出发日期，请前往「出行日期」确认。'});
  if(state.transport.selected.length===0) issues.push({level:'warning',msg:'未选择任何出行方式，请前往「出行选择」选择。'});
  if(Object.values(state.locations).flat().length===0) issues.push({level:'warning',msg:'未添加任何出行地点，请前往「出行地点」添加酒店/景点。'});
  if(state.budget.total===0 && state.budget.mode===1){
    issues.push({level:'info',msg:'旅行经费尚未设置，建议在顶部面板设定预算。'});
  }

  // 调用后端API进行真实天气预警检查
  let apiIssues=[];
  try{
    // 先查城市ID
    const cityResult=await apiFetch('/api/weather/city',{location:state.city});
    if(cityResult&&cityResult.data&&cityResult.data[0]){
      const locationId=cityResult.data[0].id;
      const checkResult=await apiFetch('/api/wechat/check-prep',{
        travelDate:state.date.start,
        city:state.city,
        locationId:locationId
      });
      if(checkResult&&checkResult.issues){
        dataSource.check='live';
        apiIssues=checkResult.issues.map(it=>({
          level:it.level,
          msg:it.message+(it.suggestion?'（'+it.suggestion+'）':'')
        }));
      }
    }
  }catch(e){console.log('[检查] API调用失败，使用本地检查逻辑');}

  // 合并API发现的问题
  if(apiIssues.length>0){
    issues.push(...apiIssues);
  }else if(pct>=60 && pct<100 && dataSource.check==='mock'){
    // API不可用时保留模拟检查
    issues.push({level:'warning',msg:'⚠️ 系统检测到：所选日期'+state.date.start+' '+state.city+'有雷阵雨预报（模拟），建议调整出行日期或携带雨具。实际天气请配置和风天气Key后获取。'});
  }

  if(issues.length===0){
    openModal('✅ 出行检查通过',`
      <div class="alert alert-success">🎉 恭喜！所有检查项均已通过，祝您旅途愉快！${dataSource.check==='live'?'<br>✅ 已通过和风天气API确认出发日无气象预警':''}</div>
      <p class="mt-16">已确认项：</p>
      <ul style="margin-left:20px;margin-top:8px">
        <li>✅ 出行准备完成度 100%</li>
        <li>✅ 出行日期已确认</li>
        <li>✅ 出行方式已选择</li>
        <li>✅ 天气状况良好</li>
        <li>✅ 路线通畅无冲突</li>
        <li>✅ 预约已确认</li>
      </ul>`,[{label:'出发！',cls:'btn-primary',fn:'closeModal()'}]);
  }else{
    let html='<div class="alert alert-danger">⛔ 系统检查未通过，存在以下问题需处理：</div>';
    if(dataSource.check==='live') html+='<div class="alert alert-info" style="font-size:11px">ℹ️ 天气检查已通过和风天气API实时验证</div>';
    issues.forEach(it=>{
      html+=`<div class="alert alert-${it.level==='danger'?'danger':it.level==='warning'?'warning':'info'}">${it.level==='danger'?'⛔':it.level==='warning'?'⚠️':'ℹ️'} ${it.msg}</div>`;
    });
    html+='<p class="mt-16" style="color:var(--danger);font-weight:600">请修正以上问题后重新提交检查，系统批准后方可出行。</p>';
    openModal('⛔ 出行检查 · 需修正',html,[
      {label:'去修改',cls:'btn-primary',fn:'closeModal()'},
      {label:'查看准备清单',cls:'btn-outline',fn:"closeModal();switchSection('prep')"}
    ]);
  }
}

function summarizeBudget(){
  const cats=budgetCategories;
  const issues=[];
  let grandTotal=0;
  const sums={};
  cats.forEach(c=>{
    let s=0;
    for(let d=0;d<3;d++){
      const v=parseInt(state.budget.fillData[`${c.key}_${d}`])||0;
      s+=v;
    }
    sums[c.key]=s; grandTotal+=s;
    document.getElementById(`sum-${c.key}`).textContent='¥'+s;
  });
  // Smart checks
  if(sums.emergency===0) issues.push({type:'warning',msg:'应急经费为0，建议预留总预算5-10%作为应急资金。'});
  if(sums.emergency>0 && sums.emergency/grandTotal<0.05 && grandTotal>0) issues.push({type:'warning',msg:`应急经费占比仅${(sums.emergency/grandTotal*100).toFixed(1)}%，低于建议的5%，旅途遇突发情况可能不足。`});
  if(sums.hotel>0 && sums.hotel/grandTotal>0.5) issues.push({type:'warning',msg:`住宿占比${(sums.hotel/grandTotal*100).toFixed(0)}%偏高，建议不超过40%，可考虑性价比更高的住宿。`});
  if(sums.transport>0 && sums.transport/grandTotal<0.1 && grandTotal>1000) issues.push({type:'info',msg:'出行经费占比偏低，确认是否已包含往返交通费用（高铁/机票）。'});
  if(sums.play===0) issues.push({type:'warning',msg:'游玩经费为0，请确认景区门票/演出票是否已计入其他板块。'});
  if(grandTotal===0) issues.push({type:'danger',msg:'所有板块均为0，请填写实际花费数据。'});

  let html=`<div style="margin-top:12px"><div class="card-title">📊 分类汇总</div>`;
  html+=`<div class="plan-bar" style="height:28px;margin:10px 0">`;
  if(grandTotal>0){
    cats.forEach(c=>{
      const pct=sums[c.key]/grandTotal*100;
      if(pct>0) html+=`<div class="plan-seg" style="width:${pct}%;background:${c.color}">${c.name} ${pct.toFixed(0)}%</div>`;
    });
  }
  html+=`</div>`;
  html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:2px solid var(--border);margin-top:8px">
    <span style="font-weight:700;font-size:16px">预估总金额</span>
    <span style="font-size:22px;font-weight:700;color:var(--primary)">¥${grandTotal}</span>
  </div></div>`;

  if(issues.length>0){
    html+='<div class="alert alert-warning mt-16">⚠️ 系统发现以下需要关注的问题：</div>';
    issues.forEach(it=>{
      html+=`<div class="alert alert-${it.type==='danger'?'danger':it.type==='warning'?'warning':'info'}">${it.type==='danger'?'⛔':it.type==='warning'?'⚠️':'💡'} ${it.msg}</div>`;
    });
  }else{
    html+='<div class="alert alert-success mt-16">✅ 预算分配合理，无明显问题。</div>';
  }
  document.getElementById('budget-summary').innerHTML=html;
}

async function searchGuides(){
  const q=(document.getElementById('guide-query').value||'杭州').trim();
  const resultsDiv=document.getElementById('guide-results');
  resultsDiv.innerHTML='<div class="empty"><div class="empty-icon" style="animation:spin 1s linear infinite">🔍</div><div>正在从高德/携程/小红书检索攻略...</div></div>';

  // 根据检索词切换城市主题
  const matchedCity = applyCityTheme(q);
  if(matchedCity){
    state.city = matchedCity;
    // 同步更新其他输入框中的城市显示
    const planCity = document.getElementById('plan-city');
    if(planCity) planCity.value = matchedCity;
  }

  // 同时加载景区导览
  fetchScenicGuides(state.city);

  // 优先调用后端API聚合搜索
  const apiResult=await apiFetch('/api/guides/search',{keywords:q,city:state.city});
  if(apiResult&&apiResult.data&&apiResult.data.length>0){
    dataSource.guides='live';
    state.guides=apiResult.data.map(g=>({
      src:g.source,
      title:g.title,
      summary:g.summary,
      tags:g.tags||[],
      similarity:g.similarity||75,
      url:g.url||null,
      note:g.note||null
    }));
    document.getElementById('guide-count').textContent=state.guides.length+' 条 · 实时';
    renderGuides();
    return;
  }

  // API不可用时回退到本地模拟数据
  const qWords=q.split(/[\s,，、]+/).filter(w=>w.length>0);
  let results=guideDB.map(g=>{
    let score=0;
    qWords.forEach(w=>{
      g.tags.forEach(t=>{if(t.includes(w)||w.includes(t))score+=2;});
      if(g.title.includes(w))score+=3;
      if(g.summary.includes(w))score+=1;
    });
    if(q==='杭州'||qWords.length===0) score+=1;
    return{...g,similarity:Math.min(95+score*2,99)};
  }).filter(g=>g.similarity>0||qWords.length===0);
  results.sort((a,b)=>b.similarity-a.similarity);
  if(results.length===0) results=guideDB.map(g=>({...g,similarity:60+Math.random()*20}));
  state.guides=results;
  document.getElementById('guide-count').textContent=results.length+' 条 · 模拟';
  renderGuides();
}

    state.scenicGuides=[];
    // 无5A景区，提示浏览全部省份
    scenicDiv.innerHTML=
      '<div class="alert alert-info" style="font-size:11px;padding:8px 12px;margin-top:8px">'+
      'ℹ️ <b>'+city+'</b> 暂无国家5A级景区。'+
      '<br><a href="javascript:void(0)" onclick="fetchProvinceTree()" style="color:var(--primary);text-decoration:underline">点击查看全国5A景区分布</a>'+
      '</div>';
    fetchProvinceTree();
  }
}

async function fetchProvinceTree(){
  const scenicDiv=document.getElementById('scenic-results');
  scenicDiv.innerHTML='<div class="empty" style="padding:12px"><div class="empty-icon" style="animation:spin 1s linear">🗺️</div><div style="font-size:12px">加载全国5A景区分布...</div></div>';
  const result=await apiFetch('/api/guides/scenic',{mode:'tree'});
  if(result&&result.provinces){
    state.scenicTree=result.provinces;
    state.scenicMapAvailable=result.mapAvailable;
    renderProvinceTree();
  }else{
    scenicDiv.innerHTML='<div class="alert alert-info" style="font-size:11px;padding:8px 12px;margin-top:8px">ℹ️ 5A景区数据加载失败</div>';
  }
}

function renderProvinceTree(){
  const c=document.getElementById('scenic-results');
  if(!state.scenicTree||state.scenicTree.length===0){c.innerHTML='';return;}
  let html='<div style="font-size:13px;font-weight:700;margin:8px 0 6px;padding:0 4px">🏞️ 全国5A级景区 · <span style="color:var(--text-muted);font-weight:400">共358家覆盖32个省级行政区 · 点击省份展开</span></div>';
  html+='<div class="a5-province-grid">';
  state.scenicTree.forEach(function(p){
    html+='<div class="a5-province-card" onclick="toggleProvince(\''+p.province+'\')" id="prov-'+p.province+'">'+
      '<div class="a5-province-name">'+p.province+' <span class="badge badge-teal">'+p.count+'</span></div>'+
      '<div id="prov-body-'+p.province+'" class="a5-province-body" style="display:none"></div>'+
    '</div>';
  });
  html+='</div>';
  c.innerHTML=html;
}

async function toggleProvince(province){
  const body=document.getElementById('prov-body-'+province);
  const card=document.getElementById('prov-'+province);
  // 如果已展开则收起
  if(body.style.display!=='none'){
    body.style.display='none';
    card.classList.remove('expanded');
    return;
  }
  // 展开 - 加载该省的景区列表
  card.classList.add('expanded');
  body.style.display='block';
  body.innerHTML='<div style="padding:8px;font-size:11px;color:var(--text-muted)">⏳ 加载中...</div>';

  const result=await apiFetch('/api/guides/scenic',{province:province});
  if(result&&result.data){
    // 按城市分组
    const cityMap={};
    result.data.forEach(function(a){
      if(!cityMap[a.city])cityMap[a.city]=[];
      cityMap[a.city].push(a);
    });
    let cityHtml='';
    Object.keys(cityMap).sort().forEach(function(cityName){
      const areas=cityMap[cityName];
      cityHtml+='<div class="a5-city-group">'+
        '<div class="a5-city-name">📍 '+cityName+' <span style="color:var(--text-muted);font-size:11px">'+areas.length+'处</span></div>'+
        '<div class="a5-area-list">'+
        areas.map(function(a,idx){
          const loc=a.district?' · '+a.district:'';
          return '<div class="a5-area-item" id="a5-item-'+province+'-'+idx+'">'+
            '<div class="a5-area-name" onclick="expandA5Area(\''+province+'\','+idx+')">'+
              '<span style="cursor:pointer">🏷️ '+a.name+'</span>'+
              '<span class="a5-area-loc" style="font-size:10px;color:var(--text-muted)">'+a.province+loc+'</span>'+
            '</div>'+
            '<div class="a5-area-detail" id="a5-detail-'+province+'-'+idx+'" style="display:none">'+
              '<div class="a5-detail-row"><b>门票：</b>'+a.ticket+'</div>'+
              '<div class="a5-detail-row"><b>简介：</b>'+a.desc+'</div>'+
              (a.mapUrl?'<div style="margin:6px 0"><img src="'+a.mapUrl+'" alt="'+a.name+'" style="width:100%;max-width:320px;border-radius:8px;cursor:zoom-in" onclick="window.open(this.src,\'_blank\')"></div>':'')+
            '</div>'+
          '</div>';
        }).join('')+
        '</div></div>';
    });
    body.innerHTML='<div style="padding:8px 6px 12px">'+cityHtml+'</div>';
  }else{
    body.innerHTML='<div style="padding:8px;font-size:11px;color:var(--text-muted)">加载失败</div>';
  }
}

function expandA5Area(province,idx){
  const detail=document.getElementById('a5-detail-'+province+'-'+idx);
  detail.style.display=detail.style.display==='none'?'block':'none';
}

/* ==================== 智能规划（三列表推荐 + 整合规划） ==================== */
const recTabs=[
  {key:'food',icon:'🍜',label:'美食推荐',desc:'本地特色餐饮'},
  {key:'outdoor',icon:'🏔️',label:'户外推荐',desc:'自然风光与户外'},
  {key:'culture',icon:'🏛️',label:'人文推荐',desc:'博物馆·古迹·剧场·乐园·大学'},
];

function planHTML(){
  const p=state.plan;
  const rec=p.recommendations;

  // ---- 推荐列表渲染 ----
  let listHtml='';
  if(rec){
    const tab=recTabs.find(t=>t.key===p.activeTab)||recTabs[0];
    const items=rec[tab.key]||[];
    const selected=p.selections[tab.key]||[];
    const totalSel=p.selections.food.length+p.selections.outdoor.length+p.selections.culture.length;
    listHtml=`
      <div class="card" style="margin-bottom:20px">
        <div class="card-title" style="margin-bottom:12px">
          📋 从推荐列表中勾选你感兴趣的（已选 ${totalSel} 项）
        </div>
        <div class="rec-tabs">
          ${recTabs.map(t=>`
            <div class="rec-tab ${p.activeTab===t.key?'active':''}" onclick="switchRecTab('${t.key}')">
              ${t.icon} ${t.label}
              <span class="tab-badge">${rec[t.key].length}</span>
            </div>
          `).join('')}
        </div>
        <div class="rec-list" style="max-height:380px;overflow-y:auto">
          ${items.map(item=>{
            const isChecked=selected.includes(item.id);
            const costCls=item.costLabel?item.costLabel.includes('平价')?'cheap':item.costLabel.includes('适中')?'mid':'high':'';
            return `
            <div class="rec-item ${isChecked?'checked':''}" onclick="toggleRecItem('${p.activeTab}','${item.id}')">
              <div class="rec-check">${isChecked?'✓':''}</div>
              <div class="rec-info">
                <div class="rec-name">${item.name}</div>
                <div class="rec-meta">
                  ${item.rating?`<span>⭐ ${item.rating}</span>`:''}
                  ${item.address?`<span>📍 ${item.address}</span>`:''}
                  ${item.costLabel?`<span class="rec-cost ${costCls}">${item.costLabel}</span>`:''}
                  ${item.tags.slice(0,3).map(t=>`<span style="font-size:10px;color:var(--text-muted)">#${t}</span>`).join('')}
                </div>
              </div>
            </div>`;
          }).join('')}
          ${items.length===0?`<div class="empty" style="padding:24px"><div>暂无推荐数据</div></div>`:''}
        </div>
        <div class="rec-summary">
          <div class="sel-count">
            🍜 ${p.selections.food.length}家美食 · 🏔️ ${p.selections.outdoor.length}处户外 · 🏛️ ${p.selections.culture.length}处人文
          </div>
          <div class="sel-tags">
            ${[...p.selections.food,...p.selections.outdoor,...p.selections.culture].slice(0,8).map(id=>{
              const name=findRecName(id);
              return name?`<span class="sel-tag">${name}</span>`:'';
            }).join('')}
          </div>
          <button class="btn btn-primary" onclick="generatePlan()" ${p.loading?'disabled':''} style="white-space:nowrap">
            ${p.loading?'⏳ 规划中...':'🚀 生成整合行程'}
          </button>
        </div>
      </div>
    `;
  }

  // ---- 结果区域 ----
  let resultHtml='';
  if(p.result){
    const r=p.result;
    const sourceCls=r.source.includes('实时')?'src-live':r.source.includes('模板')?'src-template':'src-fallback';
    resultHtml=`
      <div class="alert alert-success" style="display:flex;align-items:center;justify-content:space-between">
        <span>✅ ${r.city} · ${r.days}天整合行程已生成</span>
        <span class="plan-source-tag ${sourceCls}">${r.source}</span>
      </div>
      ${r.weatherAvailable?'<div class="budget-tip">🌤️ 已根据实时天气预报智能调整（雨天排室内、晴天排户外、高温避暑）</div>':''}
      ${r.budgetPerDay?`<div class="budget-tip">💰 日均预算约 ¥${r.budgetPerDay}</div>`:''}
      ${r.daily.map((day,i)=>`
        <div class="day-itinerary">
          <div class="day-itinerary-header ${day.weather?day.weather.text.includes('雨')?'rainy':parseInt(day.weather.tempMax)>=35?'hot':'sunny':''}">
            <div style="font-weight:700;font-size:15px">📅 ${day.date} · 第${day.day}天</div>
            ${day.weather?`<div style="font-size:13px">${day.weather.icon} ${day.weather.text} ${day.weather.tempMin}°~${day.weather.tempMax}° ${day.weather.wind||''}</div>`:''}
          </div>
          <div class="day-itinerary-body">
            ${day.schedule.map((s,idx)=>{
              const conn=day.connections&&day.connections[idx];
              return `
              <div class="itinerary-step">
                <div class="itinerary-time">${s.time}</div>
                <div class="itinerary-label">${s.icon} ${s.label}${s.isMeal?'<span style="font-size:9px;background:#fef3c7;color:#92400e;padding:0 4px;border-radius:3px;margin-left:4px">饭点</span>':''}</div>
                <div class="itinerary-content">
                  <div class="itinerary-name">${s.poi.name}${s.poi.cost?` <span style="font-size:10px;color:var(--text-muted)">${s.poi.cost}元/人</span>`:''}</div>
                  ${s.poi.address?`<div class="itinerary-addr">📍 ${s.poi.address}</div>`:''}
                  ${s.tip?`<div class="itinerary-tip">💡 ${s.tip}</div>`:''}
                </div>
              </div>
              ${conn?renderTransit(conn):''}
              `;
            }).join('')}
          </div>
        </div>
      `).join('')}
      ${!r.weatherAvailable?`<div class="alert alert-info mt-16">ℹ️ ${r.weatherHint || '天气数据不可用。配置和风天气Key后可获得更精准规划。'}</div>`:''}
    `;
  }

  return `
  <div class="section-header">
    <h2>🧠 智能行程规划</h2>
  </div>
  <div class="section-body">
    <div class="card" style="margin-bottom:20px">
      <div class="plan-controls" id="plan-controls">
        <div>
          <div class="field-label">目的地</div>
          <input type="text" class="budget-input" id="plan-city" value="${state.city}" placeholder="城市名称（如杭州）">
        </div>
        <div>
          <div class="field-label">旅行天数</div>
          <select class="budget-input" id="plan-days">
            ${[1,2,3,4,5,6,7].map(d=>`<option value="${d}" ${p.days===d?'selected':''}>${d}天</option>`).join('')}
          </select>
        </div>
        <div>
          <div class="field-label">总预算（可选）</div>
          <div class="budget-input-group" style="margin:0">
            <input type="number" class="budget-input" id="plan-budget" value="${p.budget||''}" placeholder="元">
            <span>元</span>
          </div>
        </div>
        <div>
          <button class="btn ${rec?'btn-outline':'btn-primary'}" id="plan-fetch-btn" onclick="fetchRecommendations()" ${p.loading?'disabled':''}>
            ${p.loading?'⏳ 获取中...':(rec?'🔄 刷新推荐':'🔍 获取推荐')}
          </button>
        </div>
      </div>
    </div>
    ${listHtml}
    <div id="plan-result">${resultHtml}</div>
    ${!p.result&&!rec?`<div class="empty"><div class="empty-icon">🧠</div></div>`:''}
  </div>`;
}

function renderTransit(conn){
  const icons={walk:'🚶',bus:'🚌',subway:'🚇',taxi:'🚕',mixed:'🚇',unknown:'🚗'};
  const modeName={walk:'步行',bus:'公交',subway:'地铁',taxi:'打车',mixed:'地铁+公交',unknown:'导航'};
  return `
    <div class="itinerary-transit">
      <div class="transit-icon">${icons[conn.mode]||'🚗'}</div>
      <div class="transit-content">
        <div class="transit-title">${modeName[conn.mode]||conn.mode} · ${conn.text}</div>
        <div class="transit-detail">${conn.detail}</div>
        ${conn.summary?`<div class="transit-summary">🗺️ ${conn.summary}</div>`:''}
      </div>
    </div>`;
}

function switchRecTab(key){
  state.plan.activeTab=key;
  renderSection();
}

function toggleRecItem(cat,id){
  const sel=state.plan.selections[cat];
  const idx=sel.indexOf(id);
  if(idx>=0) sel.splice(idx,1);
  else sel.push(id);
  renderSection();
}

function findRecName(id){
  const rec=state.plan.recommendations;
  if(!rec) return null;
  for(const cat of ['food','outdoor','culture']){
    const item=rec[cat].find(it=>it.id===id);
    if(item) return item.name;
  }
  return null;
}

async function fetchRecommendations(){
  const cityEl=document.getElementById('plan-city');
  const city=cityEl.value.trim();
  if(!city){alert('请输入目的地城市');return;}

  state.city=city; applyCityTheme(city);
  state.plan.loading=true;
  state.plan.result=null;
  state.plan.selections={food:[],outdoor:[],culture:[]};
  state.plan.activeTab='food';

  const btn=document.getElementById('plan-fetch-btn');
  btn.disabled=true;
  btn.textContent='⏳ 获取中...';
  renderSection();

  try{
    const result=await apiFetch('/api/plan/recommend',{},'POST',{city});
    if(result){
      state.plan.recommendations=result;
    }else{
      alert('获取推荐失败，请检查后端连接或API Key配置。');
    }
  }catch(e){
    console.error('[Plan] 获取推荐失败:',e);
    alert('获取推荐失败: '+e.message);
  }

  state.plan.loading=false;
  btn.disabled=false;
  btn.textContent='🔄 刷新推荐';
  renderSection();
}

async function generatePlan(){
  const p=state.plan;
  const cityEl=document.getElementById('plan-city');
  const daysEl=document.getElementById('plan-days');
  const budgetEl=document.getElementById('plan-budget');
  const city=cityEl.value.trim();
  const days=parseInt(daysEl.value);
  const budget=parseInt(budgetEl.value)||0;

  if(!city){alert('请输入目的地城市');return;}

  const selections={food:[],outdoor:[],culture:[]};
  const rec=p.recommendations||{};
  for(const cat of ['food','outdoor','culture']){
    selections[cat]=(p.selections[cat]||[])
      .map(id=>{const item=(rec[cat]||[]).find(it=>it.id===id);return item?item.name:null;})
      .filter(Boolean);
  }

  state.city=city; applyCityTheme(city);
  p.days=days;
  p.budget=budget;
  p.loading=true;

  const resultDiv=document.getElementById('plan-result');
  resultDiv.innerHTML='<div class="empty"><div class="empty-icon" style="animation:spin 1s linear infinite">🧠</div><div>正在生成整合行程...<br><span style="font-size:12px">地理聚类 → 天气匹配 → 餐厅就近匹配 → 节奏编排</span></div></div>';

  try{
    const result=await apiFetch('/api/plan/generate',{},'POST',{
      city,days,budget:budget||null,selections
    });
    if(result){ p.result=result; }
    else{
      p.result={
        city,days,source:'离线模板（后端未连接）',
        weatherAvailable:false,
        selections:{food:[],outdoor:[],culture:[]},
        daily:generateFallbackPlanLocal(city,days,selections)
      };
    }
  }catch(e){
    console.error('[Plan] 生成失败:',e);
    p.result={
      city,days,source:'错误恢复模板',
      weatherAvailable:false,
      selections:{food:[],outdoor:[],culture:[]},
      daily:generateFallbackPlanLocal(city,days,selections)
    };
  }

  p.loading=false;
  renderSection();
}

function generateFallbackPlanLocal(city,days,selections){
  const selFood=selections.food||[];
  const selOutdoor=selections.outdoor||[];
  const selCulture=selections.culture||[];

  const defaultRestaurants=[
    {name:city+'地道菜馆',cost:60},{name:city+'老字号餐厅',cost:80},
    {name:city+'特色小吃',cost:30},{name:city+'网红餐厅',cost:100},
    {name:city+'本地火锅',cost:90},{name:city+'农家菜',cost:50},
  ];

  const allAttr=[...selOutdoor,...selCulture];
  if(allAttr.length===0) allAttr.push(city+'市中心', city+'商业街', city+'公园');

  const daily=[];
  for(let d=0;d<days;d++){
    const spots=[
      {slot:'breakfast',time:'08:00-09:00',label:'早餐',icon:'🍳',poi:{name:'酒店早餐/当地早餐店',address:''}},
      {slot:'morning1',time:'09:00-10:30',label:'上午景点①',icon:'🏛️',poi:{name:allAttr[d*2%allAttr.length],address:''}},
      {slot:'morning2',time:'10:30-12:00',label:'上午景点②',icon:'📍',poi:{name:allAttr[(d*2+1)%allAttr.length],address:''}},
      {slot:'lunch',time:'12:00-13:30',label:'午餐',icon:'🍽️',poi:{name:selFood[d%selFood.length]||defaultRestaurants[d%6].name,address:''},isMeal:true},
      {slot:'afternoon1',time:'13:30-15:30',label:'下午景点①',icon:'🎯',poi:{name:allAttr[(d*2+2)%allAttr.length],address:''}},
      {slot:'afternoon2',time:'15:30-17:30',label:'下午景点②',icon:'📸',poi:{name:allAttr[(d*2+3)%allAttr.length],address:''}},
      {slot:'dinner',time:'17:30-19:00',label:'晚餐',icon:'🥘',poi:{name:selFood[(d+1)%selFood.length]||defaultRestaurants[(d+3)%6].name,address:''},isMeal:true},
      {slot:'evening',time:'19:00-21:00',label:'晚间活动',icon:'🌙',poi:{name:'自由探索/散步',address:''}},
    ];
    daily.push({day:d+1,date:'第'+(d+1)+'天',schedule:spots,connections:[]});
  }
  return daily;
}

</script>
